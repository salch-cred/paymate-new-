name: Relayer 15-min batch (agent / self-refill / direct-convert / pivot)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: relayer-15min
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the four 15-minute relayer endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          failed=0
          for ep in agent self-refill direct-convert pivot; do
            code=$(curl -sS -o /tmp/relayer_${ep}_body.txt -w "%{http_code}" \
              --max-time 280 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://www.paymateagent.xyz/api/relayer/${ep}")
            echo "${code}" > /tmp/relayer_${ep}_code.txt
            echo "[${ep}] HTTP ${code}"
            cat /tmp/relayer_${ep}_body.txt
            if [ "${code}" != "200" ]; then failed=1; fi
          done
          exit ${failed}

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            python3 - <<'PY'
import json, os, subprocess
parts = []
for ep in ["agent", "self-refill", "direct-convert", "pivot"]:
    try:
        code = open(f"/tmp/relayer_{ep}_code.txt").read().strip()
        body = open(f"/tmp/relayer_{ep}_body.txt").read()[:800]
    except OSError:
        code, body = "?", ""
    if code != "200":
        parts.append(f"[{ep}] HTTP {code}\n```{body}```")
if parts:
    msg = "🔴 PayMate relayer 15-min batch failed\n" + "\n".join(parts)
    subprocess.run(["curl", "-sS", "--max-time", "20", "-H", "Content-Type: application/json",
                    "-d", json.dumps({"content": msg[:1900]}), os.environ["DISCORD_WEBHOOK_URL"]])
PY
          fi
